<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Taka Technology Vietnam</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f5f5f4;
    color: #222;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .container {
    background: #ffffff;
    border-radius: 16px;
    padding: 48px 32px;
    text-align: center;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .logo {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    background: #e6f1fb;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
  }
  .logo svg { width: 36px; height: 36px; stroke: #185fa5; }
  .welcome {
    font-size: 14px;
    color: #666;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  h1 { font-size: 24px; font-weight: 500; margin-bottom: 6px; }
  .subtitle { font-size: 15px; color: #666; margin-bottom: 32px; }
  .info {
    text-align: left;
    background: #fafafa;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 28px;
  }
  .row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    font-size: 14px;
    line-height: 1.6;
  }
  .row:last-child { border-bottom: none; }
  .row svg { width: 20px; height: 20px; stroke: #185fa5; flex-shrink: 0; margin-top: 2px; }
  .row a { color: #185fa5; text-decoration: none; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: #185fa5;
    color: #fff;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
  }
  .btn svg { width: 16px; height: 16px; stroke: #fff; }
</style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/>
        <path d="M9 9h.01M9 12h.01M9 15h.01M9 18h.01"/>
      </svg>
    </div>

    <p class="welcome">WELCOME TO</p>
    <h1>Taka Technology Vietnam</h1>
    <p class="subtitle">Company Limited</p>

    <div class="info">
      <div class="row">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/>
          <path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 1 1 11.314 0z"/>
        </svg>
        <div>132-136 Lê Đình Lý,<br>Thanh Quan Building, Floor 3<br>Đà Nẵng, Vietnam</div>
      </div>
      <div class="row">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10z"/>
          <path d="M3 7l9 6l9 -6"/>
        </svg>
        <a href="mailto:android@taka-technology.com">android@taka-technology.com</a>
      </div>
      <div class="row">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2"/>
        </svg>
        <span>+84 866 043 075</span>
      </div>
    </div>

    <a class="btn" href="https://www.taka-technology.com/">
      Official website
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 6h-6a2 2 0 0 0 -2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-6"/>
        <path d="M11 13l9 -9M15 4h5v5"/>
      </svg>
    </a>
  </div>
</body>
</html>
